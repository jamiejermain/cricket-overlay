AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  cricket-live - backend for the cricket stream overlay. The scorer app (and later a
  PlayHQ webhook feed) publishes match state per channel; the overlay polls it.

Parameters:
  PlayHQWebhookSecret:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: Secret part of the PlayHQ webhook URL (/playhq/<secret>)

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: cricket-live
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      Tags: [{ Key: project, Value: cricket-live }]

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: [content-type, x-scorer-key]
        AllowMethods: [GET, PUT, POST, OPTIONS]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
      Tags: { project: cricket-live }

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/cricket-live-api
      RetentionInDays: 30

  ApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: ApiLogs
    Properties:
      FunctionName: cricket-live-api
      Runtime: nodejs20.x
      Architectures: [arm64]
      Handler: index.handler
      CodeUri: ../backend/
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          TABLE: !Ref Table
          PLAYHQ_SECRET: !Ref PlayHQWebhookSecret
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
      Tags: { project: cricket-live }
      Events:
        Health:  { Type: HttpApi, Properties: { ApiId: !Ref Api, Method: GET,  Path: /health } }
        Feed:    { Type: HttpApi, Properties: { ApiId: !Ref Api, Method: GET,  Path: '/ch/{code}/feed' } }
        DocGet:  { Type: HttpApi, Properties: { ApiId: !Ref Api, Method: GET,  Path: '/ch/{code}/doc/{path+}' } }
        DocPut:  { Type: HttpApi, Properties: { ApiId: !Ref Api, Method: PUT,  Path: '/ch/{code}/doc/{path+}' } }
        PlayHQ:  { Type: HttpApi, Properties: { ApiId: !Ref Api, Method: POST, Path: '/playhq/{secret}' } }

Outputs:
  ApiUrl:
    Description: Base URL for the scorer and overlay (goes in backend.js)
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
  TableName:
    Value: !Ref Table
