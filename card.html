<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10142e">
<title>Scorecard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  card.html — the full match scorecard, made to be shared and saved as a PDF.
  The match travels inside the link (#d=…, compressed), so a shared link keeps
  working after the next match. ?ch=<channel> shows whatever is live on that
  channel; with neither, it shows the match saved on this device.
-->
<style>
  :root { --ink:#10142e; --muted:#5d6488; --line:#e3e7f1; --soft:#f5f7fc; --bg:#eceff6; --card:#fff; --navy:#10142e;
    --num:'Barlow Condensed','Arial Narrow',sans-serif; --a:#1e6fe5; --b:#f47b20; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  button { font:inherit; }
  .tools { position:sticky; top:0; z-index:5; display:flex; gap:8px; justify-content:center; padding:10px 16px; background:rgba(16,20,46,.92); backdrop-filter:blur(8px); }
  .tools button { border:0; border-radius:99px; padding:10px 18px; font-weight:700; cursor:pointer; background:#fff; color:var(--navy); }
  .tools button.pri { background:#ffd23f; }
  main { max-width:900px; margin:0 auto; padding:20px 16px 48px; }
  .loading { text-align:center; color:var(--muted); padding:60px 0; }

  /* hero */
  .hero { position:relative; overflow:hidden; border-radius:22px; color:#fff; padding:26px 26px 22px;
    background:linear-gradient(115deg, var(--a) 0%, var(--a2) 46%, var(--b2) 54%, var(--b) 100%); }
  .hero::after { content:''; position:absolute; inset:0; background:radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.16), transparent 60%),
    repeating-linear-gradient(115deg, rgba(255,255,255,.04) 0 2px, transparent 2px 14px); pointer-events:none; }
  .meta { position:relative; z-index:1; text-align:center; font-size:12px; letter-spacing:1.4px; text-transform:uppercase; opacity:.85; font-weight:600; }
  .vs { position:relative; z-index:1; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:14px; margin:18px 0 14px; }
  .side { display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; min-width:0; }
  .logo { width:76px; height:76px; border-radius:50%; background:#fff; display:grid; place-items:center; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.25);
    border:3px solid rgba(255,255,255,.9); font:800 24px var(--num); color:var(--navy); }
  .logo img { width:100%; height:100%; object-fit:contain; }
  .tname { font:800 22px/1.05 var(--num); letter-spacing:.4px; text-transform:uppercase; overflow-wrap:anywhere; }
  .tscore { font:800 44px/1 var(--num); }
  .tscore small { font:600 17px var(--num); opacity:.8; margin-left:4px; }
  .mid { font:800 18px var(--num); opacity:.75; }
  .result { position:relative; z-index:1; text-align:center; font:800 26px/1.1 var(--num); letter-spacing:1px; background:rgba(0,0,0,.28); border-radius:12px; padding:10px 14px; }
  .toss { position:relative; z-index:1; text-align:center; font-size:12.5px; opacity:.85; margin-top:10px; }

  /* highlights */
  .hl { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:14px 0; }
  .stat { background:var(--card); border-radius:16px; padding:14px; box-shadow:0 1px 2px rgba(16,20,46,.05); border-top:4px solid var(--c, var(--navy)); min-width:0; }
  .stat .k { font-size:10.5px; letter-spacing:1.3px; text-transform:uppercase; color:var(--muted); font-weight:700; }
  .stat .v { font:800 30px/1.05 var(--num); margin-top:4px; }
  .stat .v small { font:600 15px var(--num); color:var(--muted); }
  .stat .n { font-weight:600; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stat .t { font-size:11.5px; color:var(--muted); }

  .panel { background:var(--card); border-radius:18px; box-shadow:0 1px 2px rgba(16,20,46,.05); margin-bottom:14px; overflow:hidden; }
  .panel h3 { margin:0; font-size:11px; letter-spacing:1.4px; text-transform:uppercase; color:var(--muted); padding:14px 16px 0; }
  .charts { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .charts .panel { margin:0 0 14px; }
  svg { display:block; width:100%; height:auto; }
  .legend { display:flex; gap:14px; padding:0 16px 12px; font-size:12px; color:var(--muted); flex-wrap:wrap; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }

  /* innings */
  .inn-head { display:flex; align-items:center; gap:12px; padding:14px 16px; color:#fff; background:linear-gradient(100deg, var(--c), var(--c2)); }
  .inn-head .lg { width:40px; height:40px; border-radius:50%; background:#fff; overflow:hidden; display:grid; place-items:center; font:800 14px var(--num); color:var(--navy); flex:none; }
  .inn-head .lg img { width:100%; height:100%; object-fit:contain; }
  .inn-head .nm { flex:1; min-width:0; }
  .inn-head .nm b { display:block; font:800 21px/1.05 var(--num); text-transform:uppercase; letter-spacing:.4px; }
  .inn-head .nm span { font-size:11px; letter-spacing:1.3px; text-transform:uppercase; opacity:.85; }
  .inn-head .sc { text-align:right; font:800 34px/1 var(--num); }
  .inn-head .sc small { display:block; font:600 13px var(--num); opacity:.85; letter-spacing:.5px; }
  table { width:100%; border-collapse:collapse; }
  th { font-size:10.5px; letter-spacing:1.1px; text-transform:uppercase; color:var(--muted); font-weight:700; text-align:right; padding:10px 8px 6px; border-bottom:1px solid var(--line); }
  td { padding:8px; border-bottom:1px solid var(--line); text-align:right; font-variant-numeric:tabular-nums; }
  th:first-child, td:first-child { text-align:left; padding-left:16px; }
  th:last-child, td:last-child { padding-right:16px; }
  td.nm { font-weight:600; }
  td.nm .how { display:block; font-weight:400; font-size:12px; color:var(--muted); }
  td.nm .no { color:var(--c); font-weight:700; }
  td.r { font:800 18px var(--num); }
  tr.top td.r { color:var(--c); }
  .badge { display:inline-block; font:700 9.5px Inter,sans-serif; letter-spacing:.8px; padding:2px 6px; border-radius:99px; background:var(--c); color:#fff; margin-left:6px; vertical-align:2px; }
  tr.sum td { font-weight:600; background:var(--soft); }
  tr.tot td { font:800 17px var(--num); background:var(--soft); border-bottom:0; }
  .lines { padding:10px 16px 14px; font-size:12.5px; color:var(--muted); }
  .lines p { margin:4px 0; } .lines b { color:var(--ink); }
  .sub { padding:14px 16px 4px; font-size:11px; letter-spacing:1.4px; text-transform:uppercase; color:var(--muted); font-weight:700; border-top:6px solid var(--soft); }
  .ps { padding:4px 16px 14px; }
  .p { display:grid; grid-template-columns:64px 1fr 74px; align-items:center; gap:10px; font-size:12.5px; margin:5px 0; }
  .p .bar { height:10px; border-radius:99px; background:var(--soft); overflow:hidden; }
  .p .bar i { display:block; height:100%; border-radius:99px; background:var(--c); }
  .p .w { color:var(--muted); } .p .v { text-align:right; font-weight:600; }
  footer { text-align:center; color:var(--muted); font-size:11.5px; margin-top:18px; }

  @media (max-width:680px) {
    .hl { grid-template-columns:repeat(2,1fr); }
    .charts { grid-template-columns:1fr; }
    .tscore { font-size:34px; } .tname { font-size:17px; } .logo { width:56px; height:56px; }
    .hide-sm { display:none; }
    td, th { padding-left:5px; padding-right:5px; }
  }
  /* .pdf = the copy drawn into the PDF (same look as printing) */
  body.pdf { background:#fff; font-size:12.5px; }
  body.pdf .tools { display:none; }
  body.pdf main { max-width:none; width:860px; padding:0; }
  body.pdf .panel, body.pdf .stat { box-shadow:none; border:1px solid var(--line); }
  body.pdf .pg { padding:4px; }
  body.pdf td { padding-top:4px; padding-bottom:4px; }
  body.pdf td.nm .how { display:inline; margin-left:8px; font-size:11px; }
  body.pdf td.r { font-size:16px; }
  body.pdf .inn-head { padding:10px 14px; }
  body.pdf .lines { padding:6px 16px 8px; }
  body.pdf .ps { display:grid; grid-template-columns:1fr 1fr; column-gap:28px; padding-bottom:10px; }
  body.pdf .p { margin:2px 0; }
  body.pdf .hl { grid-template-columns:repeat(4,1fr); } body.pdf .charts { grid-template-columns:1fr 1fr; }
  body.pdf .hide-sm { display:table-cell; }
  body.pdf .tscore { font-size:44px; } body.pdf .tname { font-size:22px; } body.pdf .logo { width:76px; height:76px; }
  body.pdf td, body.pdf th { padding-left:8px; padding-right:8px; }
  body.pdf td:first-child, body.pdf th:first-child { padding-left:16px; } body.pdf td:last-child, body.pdf th:last-child { padding-right:16px; }
  .cover { position:fixed; inset:0; z-index:50; display:grid; place-items:center; background:rgba(16,20,46,.9); color:#fff; font:700 18px Inter,sans-serif; }
  .busy { opacity:.6; pointer-events:none; }
  @page { size:A4; margin:10mm; }
  @media print {
    html, body { background:#fff; font-size:11.5px; }
    .tools { display:none; }
    main { max-width:none; padding:0; }
    .panel, .stat { box-shadow:none; border:1px solid var(--line); }
    .panel, .stat, .hero, .charts { break-inside:avoid; }
    .innings { break-before:page; }
    .hl { grid-template-columns:repeat(4,1fr); }
    .charts { grid-template-columns:1fr 1fr; }
    .hide-sm { display:table-cell; }
    th { padding-top:7px; padding-bottom:4px; }
    td { padding-top:3.5px; padding-bottom:3.5px; }
    td.nm .how { display:inline; margin-left:8px; font-size:10.5px; }
    td.r { font-size:15px; }
    .inn-head { padding:10px 14px; }
    .lines { padding:6px 16px 8px; }
    .sub { padding-top:9px; }
    .ps { display:grid; grid-template-columns:1fr 1fr; column-gap:28px; padding-bottom:10px; }
    .p { margin:2px 0; }
  }
</style>
</head>
<body>
<div class="tools"><button class="pri" id="pdf">Save as PDF</button><button id="share">Share link</button></div>
<main id="app"><p class="loading">Loading scorecard…</p></main>
<script src="backend.js"></script>
<script src="engine.js"></script>
<script src="sync.js"></script>
<script>
const { fromState, replay, toState, oversStr, list, ordinal } = window.CricketEngine;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const b64dec = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); const b = atob(s + '==='.slice((s.length + 3) % 4)); return Uint8Array.from(b, c => c.charCodeAt(0)); };
const pipeBytes = async (bytes, stream) => new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());

async function loadMatch() {
  const h = location.hash.match(/[#&]d=([\w-]+)/);
  if (h) return JSON.parse(new TextDecoder().decode(await pipeBytes(b64dec(h[1]), new DecompressionStream('deflate-raw'))));
  const ch = new URLSearchParams(location.search).get('ch');
  if (ch) { const live = await new CricketSync({ ch }).get('live'); if (live && live.setup && live.tick) return { setup: live.setup, state: live.tick.state }; }
  try { const g = JSON.parse(localStorage.getItem('cc.game')); if (g && g.setup) return { setup: g.setup, state: toState(replay(g.setup, g.actions).m) }; } catch (e) {}
  return null;
}

// Mix a team colour toward deep navy (k = how much of the team colour to keep).
function shade(hex, k) {
  const m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(hex || '').trim()); if (!m) return '#0b0f26';
  let h = m[1]; if (h.length === 3) h = h.replace(/./g, c => c + c);
  const n = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)), d = [11, 15, 38];
  return '#' + n.map((v, i) => Math.round(v * k + d[i] * (1 - k)).toString(16).padStart(2, '0')).join('');
}
const rate = (r, b) => (b ? (r / (b / 6)).toFixed(2) : '–');
const sr = (r, b) => (b ? (r / b * 100).toFixed(1) : '–');
const initials = t => esc((t.short || t.name || '?').slice(0, 3).toUpperCase());
const logo = t => (t.logo ? `<img src="${esc(t.logo)}" alt="">` : initials(t));
const pct = (v, max) => (max ? Math.max(3, v / max * 100) : 0);

// Runs and wickets per over, from the worm (ball-by-ball running total) and fall of wickets.
function perOver(inn) {
  const overs = Math.max(1, Math.ceil(inn.legal / 6)), out = [];
  let prev = 0;
  for (let o = 1; o <= overs; o++) {
    const pts = inn.worm.filter(p => p.b <= o * 6), r = pts.length ? pts[pts.length - 1].r : prev;
    out.push({ o, runs: Math.max(0, r - prev), w: inn.fow.filter(f => Math.max(1, Math.ceil(f.b / 6)) === o).length });
    prev = r;
  }
  if (out.length) out[out.length - 1].runs += Math.max(0, inn.runs - prev);   // anything after the last worm point
  return out;
}
function partnerships(inn) {
  const res = []; let r0 = 0, b0 = 0;
  inn.fow.forEach(f => { res.push({ w: f.w, runs: f.r - r0, balls: f.b - b0, done: true }); r0 = f.r; b0 = f.b; });
  const live = inn.batters.filter(b => b.status === 'batting').length;
  if (inn.runs > r0 || live >= 2) res.push({ w: inn.fow.length + 1, runs: inn.runs - r0, balls: inn.legal - b0, done: false });
  return res.filter(p => p.runs > 0 || p.balls > 0);
}

function wormSVG(m, T) {
  const W = 420, H = 230, L = 34, R = 10, Tp = 12, B = 28;
  const maxO = m.overs, maxR = Math.max(10, ...m.innings.map(i => i.runs));
  const top = Math.ceil(maxR / 20) * 20, x = b => L + b / (maxO * 6) * (W - L - R), y = r => H - B - r / top * (H - Tp - B);
  let g = '';
  for (let r = 0; r <= top; r += top / 4) g += `<line x1="${L}" x2="${W - R}" y1="${y(r)}" y2="${y(r)}" stroke="#e3e7f1"/><text x="${L - 6}" y="${y(r) + 4}" text-anchor="end" font-size="10" fill="#5d6488">${r}</text>`;
  const step = maxO > 30 ? 10 : 5;
  for (let o = 0; o <= maxO; o += step) g += `<text x="${x(o * 6)}" y="${H - 10}" text-anchor="middle" font-size="10" fill="#5d6488">${o}</text>`;
  const lines = m.innings.map(inn => {
    const c = T[inn.bat].primary, pts = inn.worm.map(p => `${x(p.b).toFixed(1)},${y(p.r).toFixed(1)}`).join(' ');
    const dots = inn.fow.map(f => `<circle cx="${x(f.b)}" cy="${y(f.r)}" r="4" fill="#fff" stroke="${c}" stroke-width="2.5"/>`).join('');
    return `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Score worm">${g}${lines}</svg>`;
}
function manhattanSVG(m, T) {
  const W = 420, H = 230, L = 30, R = 10, Tp = 16, B = 28, n = m.overs;
  const data = m.innings.map(inn => perOver(inn)), maxR = Math.max(6, ...data.flat().map(d => d.runs));
  const top = Math.ceil(maxR / 4) * 4, slot = (W - L - R) / n, k = m.innings.length, bw = Math.max(2, slot / k - 1.5);
  const y = r => H - B - r / top * (H - Tp - B);
  let g = '';
  for (let r = 0; r <= top; r += top / 4) g += `<line x1="${L}" x2="${W - R}" y1="${y(r)}" y2="${y(r)}" stroke="#e3e7f1"/><text x="${L - 6}" y="${y(r) + 4}" text-anchor="end" font-size="10" fill="#5d6488">${r}</text>`;
  const step = n > 30 ? 10 : 5;
  for (let o = step; o <= n; o += step) g += `<text x="${L + (o - .5) * slot}" y="${H - 10}" text-anchor="middle" font-size="10" fill="#5d6488">${o}</text>`;
  data.forEach((d, i) => {
    const c = T[m.innings[i].bat].primary;
    d.forEach(p => {
      const x0 = L + (p.o - 1) * slot + i * (slot / k) + .75;
      g += `<rect x="${x0.toFixed(1)}" y="${y(p.runs).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H - B - y(p.runs)).toFixed(1)}" rx="1.5" fill="${c}"/>`;
      for (let w = 0; w < p.w; w++) g += `<circle cx="${(x0 + bw / 2).toFixed(1)}" cy="${(y(p.runs) - 6 - w * 9).toFixed(1)}" r="3.6" fill="#e5383b" stroke="#fff" stroke-width="1"/>`;
    });
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Runs per over">${g}</svg>`;
}

function inningsHTML(m, inn, idx, T) {
  const bat = T[inn.bat], c = bat.primary;
  const order = [...inn.order, ...inn.batters.filter(b => b.status !== 'yet' && !inn.order.includes(b.id)).map(b => b.id)];
  const batted = order.map(id => inn.batters[id]).filter(Boolean);
  const topR = Math.max(0, ...batted.map(b => b.runs));
  const rows = batted.map(b => {
    const out = b.status === 'out', how = out ? [b.how, b.bow].filter(Boolean).join(' ') || 'out' : b.status === 'retired' ? 'retired not out' : 'not out';
    const badge = b.runs >= 100 ? '<span class="badge">100</span>' : b.runs >= 50 ? '<span class="badge">50</span>' : '';
    return `<tr class="${b.runs === topR && topR > 0 ? 'top' : ''}"><td class="nm">${esc(b.name)}${out ? '' : '<span class="no">*</span>'}${badge}<span class="how">${esc(how)}</span></td>
      <td class="r">${b.runs}</td><td>${b.balls}</td><td>${b.fours}</td><td>${b.sixes}</td><td class="hide-sm">${sr(b.runs, b.balls)}</td></tr>`;
  }).join('');
  const x = inn.extras, xt = x.wd + x.nb + x.b + x.lb;
  const dnb = inn.batters.filter(b => b.status === 'yet').map(b => esc(b.name));
  const fow = inn.fow.map(f => `<b>${f.w}-${f.r}</b> (${esc(f.name)}, ${oversStr(f.b)})`).join(' · ');
  const bestW = Math.max(0, ...inn.bowlers.map(b => b.wkts));
  const bowl = inn.bowlers.map(b => `<tr class="${b.wkts === bestW && bestW > 0 ? 'top' : ''}"><td class="nm">${esc(b.name)}</td><td>${oversStr(b.balls)}</td><td>${b.maidens}</td>
    <td>${b.runs}</td><td class="r">${b.wkts}</td><td>${rate(b.runs, b.balls)}</td><td class="hide-sm">${b.wd || 0}</td><td class="hide-sm">${b.nb || 0}</td></tr>`).join('');
  const ps = partnerships(inn), maxP = Math.max(1, ...ps.map(p => p.runs));
  const allOut = inn.wkts >= Math.max(1, inn.batters.length - 1);
  const wk = allOut ? 'all out' : `${inn.wkts} wkt${inn.wkts === 1 ? '' : 's'}`;
  return `<section class="panel innings pg" style="--c:${esc(c)};--c2:${shade(c, .6)}">
    <div class="inn-head"><span class="lg">${logo(bat)}</span><div class="nm"><span>${ordinal(idx + 1)} innings · batting</span><b>${esc(bat.name)}</b></div>
      <div class="sc">${inn.runs}${allOut ? '' : '/' + inn.wkts}<small>${oversStr(inn.legal)} overs · RR ${rate(inn.runs, inn.legal)}</small></div></div>
    <table><thead><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th class="hide-sm">SR</th></tr></thead><tbody>${rows}
      <tr class="sum"><td>Extras <span class="how" style="display:inline;font-weight:400;color:var(--muted)">(wd ${x.wd}, nb ${x.nb}, b ${x.b}, lb ${x.lb})</span></td><td class="r">${xt}</td><td colspan="4"></td></tr>
      <tr class="tot"><td>Total <span style="font:600 13px var(--num);color:var(--muted)">(${wk}, ${oversStr(inn.legal)} ov)</span></td><td>${inn.runs}</td><td colspan="4"></td></tr></tbody></table>
    <div class="lines">${dnb.length ? `<p><b>Did not bat:</b> ${dnb.join(', ')}</p>` : ''}${fow ? `<p><b>Fall of wickets:</b> ${fow}</p>` : ''}</div>
    <div class="sub">Bowling · ${esc(T[inn.bowl].name)}</div>
    <table><thead><tr><th>Bowler</th><th>O</th><th>M</th><th>R</th><th>W</th><th>Econ</th><th class="hide-sm">Wd</th><th class="hide-sm">Nb</th></tr></thead><tbody>${bowl}</tbody></table>
    ${ps.length ? `<div class="sub">Partnerships</div><div class="ps">${ps.map(p => `<div class="p"><span class="w">${ordinal(p.w)} wkt</span><span class="bar"><i style="width:${pct(p.runs, maxP)}%"></i></span><span class="v">${p.runs}${p.done ? '' : '*'} (${p.balls})</span></div>`).join('')}</div>` : ''}
  </section>`;
}

function render(data) {
  const setup = data.setup, m = fromState(setup, data.state), T = setup.teams, mt = setup.match || {};
  if (m.status === 'complete' && !m.result) m.computeResult();
  for (const k of ['home', 'away']) { T[k].primary = T[k].primary || (k === 'home' ? '#1e6fe5' : '#f47b20'); }
  const first = m.innings[0].bat, second = first === 'home' ? 'away' : 'home';
  const innOf = k => m.innings.find(i => i.bat === k);
  const scoreOf = k => { const i = innOf(k); if (!i) return '<span class="tscore">–</span>'; const ao = i.wkts >= Math.max(1, i.batters.length - 1);
    return `<span class="tscore">${i.runs}${ao ? '' : '/' + i.wkts}<small>(${oversStr(i.legal)})</small></span>`; };
  const side = k => `<div class="side"><span class="logo">${logo(T[k])}</span><span class="tname">${esc(T[k].name)}</span>${scoreOf(k)}</div>`;
  const status = m.status === 'complete' ? m.result : m.status === 'break' ? `Innings break · ${T[second].name} need ${m.target}` :
    m.current === 1 ? `${T[m.inn.bat].name} need ${m.target - m.inn.runs} from ${m.overs * 6 - m.inn.legal} balls` : 'Match in progress';
  const dt = mt.date ? new Date(mt.date) : null;
  const when = dt && !isNaN(dt) ? dt.toLocaleDateString('en-NZ', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' }) : '';
  const meta = [mt.comp || mt.title, mt.venue || mt.ground, when, `${m.overs} overs`].filter(Boolean).map(esc).join(' · ');

  // Highlights across the match.
  const allBat = m.innings.flatMap(i => i.batters.filter(b => b.status !== 'yet').map(b => ({ ...b, team: i.bat })));
  const allBowl = m.innings.flatMap(i => i.bowlers.map(b => ({ ...b, team: i.bowl })));
  const topBat = allBat.slice().sort((a, b) => b.runs - a.runs || a.balls - b.balls)[0];
  const topBowl = allBowl.slice().sort((a, b) => b.wkts - a.wkts || a.runs - b.runs)[0];
  const allP = m.innings.flatMap(i => partnerships(i).map(p => ({ ...p, team: i.bat })));
  const topP = allP.sort((a, b) => b.runs - a.runs)[0];
  const sixes = allBat.reduce((s, b) => s + b.sixes, 0), fours = allBat.reduce((s, b) => s + b.fours, 0);
  const stat = (k, v, n, t, c) => `<div class="stat" style="--c:${esc(c || '#10142e')}"><div class="k">${k}</div><div class="v">${v}</div><div class="n">${n}</div><div class="t">${t}</div></div>`;
  const hl = [
    topBat ? stat('Top score', `${topBat.runs}${topBat.status === 'out' ? '' : '*'} <small>(${topBat.balls})</small>`, esc(topBat.name), esc(T[topBat.team].name), T[topBat.team].primary) : '',
    topBowl ? stat('Best bowling', `${topBowl.wkts}/${topBowl.runs}`, esc(topBowl.name), `${oversStr(topBowl.balls)} overs · ${esc(T[topBowl.team].name)}`, T[topBowl.team].primary) : '',
    topP ? stat('Best partnership', `${topP.runs}${topP.done ? '' : '*'} <small>(${topP.balls})</small>`, `${ordinal(topP.w)} wicket`, esc(T[topP.team].name), T[topP.team].primary) : '',
    stat('Boundaries', `${fours} <small>fours</small> · ${sixes} <small>sixes</small>`, `${m.innings.reduce((s, i) => s + i.extras.wd + i.extras.nb + i.extras.b + i.extras.lb, 0)} extras`, 'whole match'),
  ].join('');

  const legend = m.innings.map(i => `<span><i style="background:${esc(T[i.bat].primary)}"></i>${esc(T[i.bat].name)}</span>`).join('');
  document.title = `${T.home.name} v ${T.away.name} – Scorecard`;
  document.documentElement.style.setProperty('--a', T[first].primary);
  document.documentElement.style.setProperty('--b', T[second].primary);
  document.documentElement.style.setProperty('--a2', shade(T[first].primary, .55));
  document.documentElement.style.setProperty('--b2', shade(T[second].primary, .55));
  $('#app').innerHTML = `
    <div class="pg">
    <section class="hero"><div class="meta">${meta}</div>
      <div class="vs">${side(first)}<span class="mid">V</span>${side(second)}</div>
      <div class="result">${esc(status)}</div>${mt.toss ? `<div class="toss">${esc(mt.toss)}</div>` : ''}</section>
    <div class="hl">${hl}</div>
    <div class="charts">
      <section class="panel"><h3>Score worm</h3>${wormSVG(m, T)}<div class="legend">${legend}<span>○ wicket</span></div></section>
      <section class="panel"><h3>Runs per over</h3>${manhattanSVG(m, T)}<div class="legend">${legend}<span><i style="background:#e5383b;border-radius:50%"></i>wicket</span></div></section>
    </div></div>
    ${m.innings.map((inn, i) => inningsHTML(m, inn, i, T)).join('')}
    <footer>${esc(T.home.name)} v ${esc(T.away.name)}${when ? ' · ' + esc(when) : ''}</footer>`;
}

// Save as PDF: draw each page block to an image and lay them onto A4 pages, then download the file.
// (Doesn't rely on the browser's print, which comes out blank in some browsers.)
const loadScript = src => new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
async function makePDF() {
    if (!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if (!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    await document.fonts.ready;
    const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', compress: true }), PW = 210, PH = 297, M = 10;
    const blocks = [...document.querySelectorAll('#app .pg')];
    // Lay the page out at a fixed A4-ish width while drawing (a cover hides the switch).
    const cover = document.createElement('div'); cover.className = 'cover'; cover.textContent = 'Making your PDF…';
    document.body.appendChild(cover); document.body.classList.add('pdf');
    try {
    for (let i = 0; i < blocks.length; i++) {
      const c = await html2canvas(blocks[i], { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false,
        ignoreElements: el => el.classList && el.classList.contains('cover') });
      let w = PW - 2 * M, h = c.height * w / c.width;
      if (h > PH - 2 * M) { h = PH - 2 * M; w = c.width * h / c.height; }
      if (i) pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', (PW - w) / 2, M, w, h);
    }
    } finally { document.body.classList.remove('pdf'); cover.remove(); }
    pdf.setFontSize(8); pdf.setTextColor(93, 100, 136);
    pdf.text($('footer') ? $('footer').textContent : '', PW / 2, PH - 5, { align: 'center' });
    return pdf.output('blob');
}
async function savePDF() {
  const btn = $('#pdf'), label = btn.textContent;
  btn.textContent = 'Making PDF…'; btn.classList.add('busy');
  try {
    const blob = await makePDF(), name = document.title.replace(/[\/\\:*?"<>|]/g, '-') + '.pdf';
    const file = new File([blob], name, { type: 'application/pdf' });
    // iPad / iPhone: the share sheet (Save to Files, Mail, WhatsApp…). Elsewhere: a normal download.
    if (navigator.maxTouchPoints > 1 && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: document.title }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 8000);
  } catch (e) {
    console.error(e); alert("Couldn't make the PDF here. Try again, or use your browser's Print → Save as PDF.");
  } finally { btn.textContent = label; btn.classList.remove('busy'); }
}
$('#pdf').onclick = savePDF;
$('#share').onclick = async () => {
  const url = location.href, title = document.title;
  try { if (navigator.share) { await navigator.share({ title, url }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(url); $('#share').textContent = 'Link copied ✓'; setTimeout(() => ($('#share').textContent = 'Share link'), 1800); }
  catch (e) { window.prompt('Copy this link', url); }
};
loadMatch().then(d => { if (d) render(d); else $('#app').innerHTML = '<p class="loading">No scorecard in this link.</p>'; })
  .catch(e => { console.error(e); $('#app').innerHTML = '<p class="loading">Couldn\'t open this scorecard link. Ask for the link again.</p>'; });
</script>
</body>
