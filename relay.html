<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141a4a">
<title>PlayHQ Relay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#eef1f7; --card:#fff; --ink:#10142e; --muted:#5a6286; --line:#dde2ee; --navy:#141a4a;
    --blue:#1e6fe5; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --num:'Barlow Condensed','Arial Narrow',sans-serif; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  button, input, select, textarea { font:inherit; color:inherit; }
  .top { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--navy); color:#fff; }
  .brand { font:800 22px var(--num); letter-spacing:1px; flex:1; }
  .pill { border-radius:99px; padding:5px 11px; font-size:13px; font-weight:600; background:rgba(255,255,255,.12); white-space:nowrap; }
  .pill::before { content:'●'; margin-right:6px; color:#9ca3af; }
  .pill.ok::before { color:#4ade80; } .pill.wait::before { color:#fbbf24; } .pill.bad::before { color:#f87171; }
  main { max-width:560px; margin:0 auto; padding:12px 12px 40px; }
  .card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:0 1px 2px rgba(16,20,46,.06), 0 4px 16px rgba(16,20,46,.05); }
  h2 { margin:0 0 10px; font-size:18px; } h3 { margin:0 0 8px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
  p { margin:0 0 10px; } ol { margin:0 0 10px; padding-left:20px; } li { margin-bottom:6px; }
  .muted { color:var(--muted); font-size:13px; }
  .bm { display:inline-block; padding:10px 16px; border-radius:12px; background:var(--blue); color:#fff; font-weight:700; text-decoration:none; cursor:grab; }
  textarea, input[type=text] { width:100%; border:1px solid var(--line); border-radius:10px; padding:10px; background:#f7f8fc; font-size:13px; }
  textarea { height:84px; font-family:ui-monospace,Menlo,monospace; font-size:11px; }
  select { width:100%; border:1px solid var(--line); border-radius:10px; padding:9px; background:#fff; }
  .btn { border:0; border-radius:12px; padding:11px 16px; font-weight:700; background:var(--blue); color:#fff; cursor:pointer; }
  .btn.ghost { background:#e8ecf6; color:var(--ink); } .btn.stop { background:var(--bad); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .score { display:flex; align-items:center; gap:12px; padding:14px; border-radius:14px; background:var(--navy); color:#fff; }
  .score .t { flex:1; font:700 20px var(--num); letter-spacing:.5px; }
  .score .r { font:800 34px var(--num); }
  .score .o { font:600 16px var(--num); opacity:.75; }
  .line { margin-top:10px; font-size:14px; }
  .team { display:grid; grid-template-columns:44px 1fr; gap:10px; align-items:center; margin-bottom:10px; }
  .logo { width:44px; height:44px; border-radius:50%; display:grid; place-items:center; overflow:hidden; background:var(--tp,#333); border:3px solid var(--ta,#999); color:#fff; font:800 14px var(--num); }
  .logo img { width:100%; height:100%; object-fit:cover; background:#fff; }
  .warn { background:#fff7e6; border:1px solid #fde3a7; border-radius:12px; padding:10px 12px; font-size:13px; }
  .bad { background:#fdecec; border:1px solid #f8c4c4; border-radius:12px; padding:10px 12px; font-size:14px; }
  .log { font:12px/1.5 ui-monospace,Menlo,monospace; color:var(--muted); max-height:140px; overflow:auto; white-space:pre-wrap; }
</style>
</head>
<body>
<div class="top"><div class="brand">PLAYHQ RELAY</div><div id="pill" class="pill">Not connected</div></div>
<main id="app"></main>

<script src="config.js"></script>
<script src="backend.js"></script>
<script src="engine.js"></script>
<script src="sync.js"></script>
<script src="phq.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   relay.html — follows a game on PlayHQ's live scoring and sends it
   to the overlay, so nobody has to score twice.

   playhq.com only lets its own pages read the live data, and its
   pages can't send anything to other sites. So:
     • the PlayHQ tab (after you tap the bookmark) fetches PlayHQ's
       live data when asked;
     • this window asks every few seconds, converts it (phq.js) and
       publishes it to the channel like the scorer app does.
   ───────────────────────────────────────────────────────────── */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const LS = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const { fromState, oversStr, statusList } = window.CricketEngine;
const qp = new URLSearchParams(location.search);
const GAME = (qp.get('game') || '').replace(/[^0-9a-z]/gi, '');
const POLL_MS = 4000;          // no live connection: check every 4 s
const BACKUP_MS = 30000;       // live connection up: PlayHQ pushes changes, check every 30 s as a backup
const SETTLE_MS = 800;         // after a push, give PlayHQ a moment to save that ball's commentary too

let settings = LS.get('cc.settings') || {};
if (qp.get('ch') && qp.get('k')) {                   // opened from the scorer's private relay link
  settings = { ch: qp.get('ch'), key: qp.get('k') }; LS.set('cc.settings', settings);
  qp.delete('ch'); qp.delete('k'); history.replaceState(null, '', location.pathname + (qp.toString() ? '?' + qp : ''));
}
let library = LS.get('cc.library', {});
const prefsKey = 'cc.relay.' + GAME;
let rp = LS.get(prefsKey, { home: null, away: null, on: true });
let src = window.opener || null, srcOk = false;
let teamsPhq = null, game = null, cache = {}, lastState = null, lastSetupJson = '', seq = LS.get('cc.relay.seq', 0);
let lastBallAt = 0, lastErr = '', running = false, logLines = [];
let sync = null, matchInfo = null;
// Live connection (opened by the bookmark in the PlayHQ tab).
let live = false, liveSeen = false, pushed = null, pushes = 0, wakeUp = null, followUp = false;

function log(s) { logLines.unshift(new Date().toLocaleTimeString() + '  ' + s); logLines = logLines.slice(0, 30); const el = $('#log'); if (el) el.textContent = logLines.join('\n'); }
function pill(cls, txt) { const p = $('#pill'); p.className = 'pill ' + cls; p.textContent = txt; }

/* ── talking to the PlayHQ tab ── */
let reqId = 0; const waiting = {};
addEventListener('message', e => {
  const d = e.data;
  if (!d || !/^https:\/\/([a-z0-9-]+\.)*playhq\.com$/.test(e.origin)) return;
  if (d.t === 'phq-live') {
    liveSeen = true;
    if (d.on !== live) log(d.on ? 'Live updates on' : 'Live updates off' + (d.error ? ': ' + d.error : ', checking every 4 s'));
    live = !!d.on; renderStatus(); return;
  }
  if (d.t === 'phq-push') {
    const g = d.data && d.data.gameUpdated; if (!g) return;
    pushed = g; pushes++; live = true; liveSeen = true;
    if (wakeUp) wakeUp(); return;
  }
  const w = waiting[d.id]; if (w) { delete waiting[d.id]; w(d); }
});
function subscribe() {
  if (src && !src.closed) src.postMessage({ t: 'phq-sub', query: PlayHQ.Q.gameSub, variables: PlayHQ.gameVars(GAME) }, '*');
}
function ask(ep, query, variables, ms = 15000) {
  return new Promise((res, rej) => {
    if (!src || src.closed) return rej(new Error('nosrc'));
    const id = ++reqId, t = setTimeout(() => { delete waiting[id]; rej(new Error('timeout')); }, ms);
    waiting[id] = d => { clearTimeout(t); if (!d.ok) return rej(new Error(d.error || 'HTTP ' + d.status)); if (d.json && d.json.errors && !d.json.data) return rej(new Error(d.json.errors[0].message)); res(d.json.data); };
    src.postMessage({ t: 'phq', id, ep, query, variables }, '*');
  });
}

/* ── teams: saved scorer team if names match, else PlayHQ's name + logo ── */
const norm = s => String(s || '').toLowerCase().replace(/\b(1st|2nd|3rd|\d+th|grade|under|u\d+|div(ision)?|cricket|club|cc|inc)\b/g, '').replace(/[^a-z]/g, '');
function guessLib(name) {
  const n = norm(name); if (!n) return null;
  return Object.keys(library).find(k => norm(k) && (n.includes(norm(k)) || norm(k).includes(n))) || null;
}
const DEFAULT = { home: ['#f47b20', '#ffd166'], away: ['#1f4fd1', '#7cc4ff'] };
function teamFor(k) {
  const p = teamsPhq && teamsPhq[k] || { name: k === 'home' ? 'Home' : 'Away' };
  const pick = rp[k] === undefined || rp[k] === null ? guessLib(p.name) : rp[k];
  if (pick && library[pick]) { const t = library[pick]; return { name: t.name, short: t.short || t.name.slice(0, 3).toUpperCase(), primary: t.primary, accent: t.accent, logo: t.logo || '', logoOriginal: t.logoOriginal || t.logo || '', keeper: 0 }; }
  const logo = p.logo || '', name = p.name.replace(/\s+(1st|2nd|3rd|\d+th)\s+grade$/i, '').trim() || p.name;
  const caps = (name.match(/\b[A-Z]|[A-Z](?=[A-Z])/g) || []).join('');
  const short = (caps.length >= 2 ? caps : name.replace(/[^A-Za-z]/g, '')).slice(0, 3).toUpperCase();
  return { name, short, primary: DEFAULT[k][0], accent: DEFAULT[k][1], logo, logoOriginal: logo, keeper: 0 };
}

/* ── one poll ── */
async function loadTeams() {
  try {
    const d = await ask('api', PlayHQ.Q.teams, { gameId: GAME });
    const g = d && d.discoverGame; if (!g) return;
    const pickLogo = t => { const s = ((t.logo && t.logo.sizes) || []).slice().sort((a, b) => b.dimensions.width - a.dimensions.width); return s[0] ? s[0].url : ''; };
    const v = g.allocation && g.allocation.court, r = g.round;
    matchInfo = {
      venue: (v && v.venue && v.venue.name) || (v && v.name) || '',
      date: g.date || '',
      comp: r ? [r.grade && r.grade.name, r.name].filter(Boolean).join(' · ') : '',
    };
    teamsPhq = { home: { name: g.home.name, logo: g.home.logo ? pickLogo(g.home) : '' }, away: { name: g.away.name, logo: g.away.logo ? pickLogo(g.away) : '' } };
  } catch (e) { log('Team names: ' + e.message); }
}
// Newest page every poll. Page back further when joining, or if we've missed
// more than a page (e.g. the connection dropped for a few overs). Page sizes vary.
async function loadEvents(period, side, all) {
  const key = `${period}|${side}`, known = new Set(Object.keys(cache[key] || {}));
  let page = (await ask('spectator', PlayHQ.Q.events, PlayHQ.eventsVars(GAME, period, side))).gameEvents || [];
  PlayHQ.ingestEvents(cache, key, page, true);
  const gap = () => known.size > 0 && page.length > 0 && !page.some(e => known.has(e.id));
  let guard = 0;
  while ((all || gap()) && page.length && guard++ < 80) {
    const after = Math.min(...page.map(e => +e.timestamp));
    page = (await ask('spectator', PlayHQ.Q.events, PlayHQ.eventsVars(GAME, period, side, after))).gameEvents || [];
    PlayHQ.ingestEvents(cache, key, page, false);
  }
  const newest = Object.values(cache[key] || {}).reduce((m, e) => Math.max(m, +e.timestamp), 0);
  return newest;
}
let joined = {};
async function poll() {
  if (pushed) { game = pushed; pushed = null; }
  else { const d = await ask('spectator', PlayHQ.Q.game, PlayHQ.gameVars(GAME)); game = d && d.game; }
  if (!game) throw new Error('PlayHQ has no live data for this game');
  // Which innings have data? Fetch their ball-by-ball (all of it the first time).
  const R = game.result || {}, cur = R.currentPeriod || {};
  const inns = [];
  for (const k of ['home', 'away']) for (const p of (R[k] && R[k].periods) || []) if (p.role === 'BATTING' && /INNINGS/.test(p.period.value)) inns.push([p.period.value, k.toUpperCase()]);
  let newest = 0;
  for (const [period, side] of inns) {
    const key = `${period}|${side}`, isCur = cur.value === period && cur.primarySide === side;
    if (!joined[key]) { newest = Math.max(newest, await loadEvents(period, side, true)); joined[key] = true; }
    else if (isCur) newest = Math.max(newest, await loadEvents(period, side, false));
  }
  // The scorecard was read a moment before the ball-by-ball. If a ball landed in
  // between, read the scorecard again so the batter's runs include it.
  const recorded = Date.parse(game.lastEventRecordedAt || '') || 0;
  if (recorded && newest > recorded + 1000) {
    const again = await ask('spectator', PlayHQ.Q.game, PlayHQ.gameVars(GAME));
    if (again && again.game) game = again.game;
  }
  return publishFrom(game);
}

function publishFrom(g) {
  const teams = { home: teamFor('home'), away: teamFor('away') };
  const title = / v /.test(qp.get('title') || '') ? qp.get('title') : '';
  const { setup, state } = PlayHQ.build(g, cache, teams, { gameId: GAME, setupId: 'phq-' + GAME, title, info: matchInfo });
  // Result text, worked out the same way the scorer does.
  if (state.status === 'complete' && state.innings.length === 2) { const m = fromState(setup, state); m.computeResult(); state.result = m.result; state.winner = m.winner; }
  else if (state.status === 'complete') state.result = 'MATCH COMPLETE';
  const ev = PlayHQ.diff(lastState, state, cache);
  showScore(setup, state);
  if (!ev) return null;
  const sJson = JSON.stringify(setup), newSetup = sJson !== lastSetupJson;
  lastState = state;
  if (ev.kind === 'ball') lastBallAt = Date.now();
  if (!rp.on) return ev;
  seq++; LS.set('cc.relay.seq', seq);
  const tick = { state, event: { seq, ...ev }, at: Date.now(), source: 'playhq' };
  if (newSetup) { sync.put('live', { setup, tick }); lastSetupJson = sJson; } else sync.put('live/tick', tick);
  if (ev.kind === 'ball') log(describe(ev, state));
  return ev;
}
function describe(ev, s) {
  if (ev.wicket) return `WICKET – ${ev.wicket.batter.name} ${ev.wicket.text}`;
  if (ev.boundary) return `${ev.boundary === 6 ? 'SIX' : 'FOUR'} – ${ev.batter.name}`;
  const i = s.innings[s.current]; return `Ball – ${i.runs}/${i.wkts} (${oversStr(i.legal)})`;
}

/* ── loop ── */
let fails = 0, backupCheck = false;
async function loop() {
  if (running) return; running = true;
  for (;;) {
    try {
      if (!src || src.closed) throw new Error('nosrc');
      if (!teamsPhq) { await loadTeams(); renderTeams(); }
      const ev = await poll(); srcOk = true;
      // A 30-second backup check found a ball the live connection never told us
      // about: it has gone quiet without closing. Reconnect, and check every 4 s
      // until it's back.
      if (backupCheck && live && ev && ev.kind === 'ball') { live = false; log('Live updates missed a ball: reconnecting, checking every 4 s'); subscribe(); } lastErr = ''; fails = 0;
      pill(rp.on ? 'ok' : 'wait', rp.on ? (sync.mode === 'cloud' ? 'Sending live' : 'This browser only') : 'Paused');
    } catch (e) {
      fails++;
      const msg = e.message === 'nosrc' ? 'PlayHQ tab closed' : e.message === 'timeout' ? 'PlayHQ tab not answering'
        : /fetch|network/i.test(e.message) ? "Can't reach PlayHQ" : e.message;
      log('Problem: ' + msg);
      // One blip is normal; only shout after a few in a row (or if the tab is gone).
      if (fails >= 3 || e.message === 'nosrc') { srcOk = false; lastErr = msg; pill('bad', msg); } else pill('wait', 'Retrying…');
    }
    renderStatus();
    if (pushed) { await tick(SETTLE_MS); continue; }   // a push came in while we were busy
    // A push wakes us straight away; otherwise wait for the next backup check.
    // After a push, check once more a few seconds later in case PlayHQ saved
    // the commentary for that ball a little after the scorecard.
    const wait = !live ? POLL_MS : followUp ? 3000 : BACKUP_MS;
    backupCheck = wait === BACKUP_MS; followUp = false;
    const woke = await new Promise(r => { wakeUp = () => r(true); tick(wait).then(() => r(false)); });
    wakeUp = null;
    if (woke) { followUp = true; backupCheck = false; await tick(SETTLE_MS); }
  }
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
// Timers in a background or covered window get slowed to once a minute by the
// browser; a worker's timer isn't, so the relay keeps its pace.
const ticker = (() => { try { return new Worker(URL.createObjectURL(new Blob(['onmessage=e=>setTimeout(()=>postMessage(e.data.id),e.data.ms)'], { type: 'text/javascript' }))); } catch (e) { return null; } })();
const timers = {}; let timerId = 0;
if (ticker) ticker.onmessage = e => { const r = timers[e.data]; delete timers[e.data]; if (r) r(); };
const tick = ms => ticker ? new Promise(r => { const id = ++timerId; timers[id] = r; ticker.postMessage({ id, ms }); }) : sleep(ms);
// Keep the screen awake while this window is showing.
let wake = null;
async function keepAwake() { try { if (navigator.wakeLock && document.visibilityState === 'visible' && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {} }
document.addEventListener('visibilitychange', keepAwake);

/* ── screens ── */
function bookmarkletCode() {
  const O = location.origin, P = O + location.pathname;
  const js = `(()=>{const P=${JSON.stringify(P)};const m=location.pathname.match(/game-centre\\/([0-9a-z]+)/i);if(!/playhq\\.com$/.test(location.hostname)||!m){alert('Open the game on playhq.com first: the page with the Scorecard and Ball-by-ball tabs.');return}const live=(s,o,d,n)=>{if(s.closed)return;const ws=new WebSocket('wss://spectator.playhq.com/graphql?tenant=ca','graphql-transport-ws');if(window.__ccWs)window.__ccWs.close();window.__ccWs=ws;let ok=0;const tell=m=>{try{s.postMessage(m,o)}catch(_){}};ws.onopen=()=>ws.send('{"type":"connection_init","payload":{}}');ws.onmessage=m=>{if(s.closed)return ws.close();const x=JSON.parse(m.data);if(x.type==='connection_ack'){ok=1;ws.send(JSON.stringify({id:'1',type:'subscribe',payload:{query:d.query,variables:d.variables}}));tell({t:'phq-live',on:true})}else if(x.type==='ping')ws.send('{"type":"pong"}');else if(x.type==='next')tell({t:'phq-push',data:x.payload&&x.payload.data});else if(x.type==='error')tell({t:'phq-live',on:false,error:JSON.stringify(x.payload).slice(0,200)})};ws.onclose=()=>{if(window.__ccWs!==ws)return;window.__ccWs=null;tell({t:'phq-live',on:false});const w=ok?2:Math.min(n*2,60);setTimeout(()=>live(s,o,d,w),w*1000)}};if(!window.__ccRelay){window.__ccRelay=1;addEventListener('message',async e=>{const d=e.data;if(e.origin!==${JSON.stringify(O)}||!d)return;if(d.t==='phq-sub')return live(e.source,e.origin,d,2);if(d.t!=='phq')return;const u=d.ep==='api'?'https://api.playhq.com/graphql':'https://spectator.playhq.com/graphql';let r;try{const x=await fetch(u,{method:'POST',headers:{'content-type':'application/json','x-phq-tenant':'ca',tenant:'ca'},body:JSON.stringify({query:d.query,variables:d.variables})});r={ok:x.ok,status:x.status,json:await x.json()}}catch(err){r={ok:false,error:String(err)}}e.source.postMessage(Object.assign({t:'phq-r',id:d.id},r),e.origin)})}const w=window.open(P+'?game='+m[1]+'&title='+encodeURIComponent(document.title.split(' - ')[0].split(',')[0]),'cricketrelay','width=460,height=820');if(!w)alert('Allow pop-ups for playhq.com, then tap the bookmark again.')})()`;
  return 'javascript:' + encodeURIComponent(js).replace(/%2C/g, ',').replace(/%3A/g, ':').replace(/%2F/g, '/').replace(/%3D/g, '=').replace(/%3B/g, ';');
}
function needLink() {
  return `<section class="card"><h2>First, link this browser to your scorer</h2>
    <p>The relay sends scores to the same overlay link as your scorer app, so it needs your scorer's private link.</p>
    <ol><li>On your scoring phone open the scorer, tap <b>☰ → Settings</b> and copy the link under <b>Follow PlayHQ instead of scoring</b> (or <b>Score from another phone or iPad</b>).</li>
    <li>Open that link on this device, or paste it here:</li></ol>
    <input type="text" id="lnk" placeholder="https://…/score.html?ch=…&k=…"><div class="row" style="margin-top:10px"><button class="btn" data-act="link">Use this link</button></div></section>`;
}
function render() {
  const app = $('#app');
  if (!settings.ch || !settings.key) { app.innerHTML = needLink(); return; }
  if (!GAME || !src) { app.innerHTML = setupScreen(); return; }
  app.innerHTML = `
    <section class="card" id="status"></section>
    <section class="card"><h3>Team colours &amp; logos</h3><div id="teams"></div>
      <p class="muted">Pick a team you saved in the scorer to use its colours and logo. Otherwise PlayHQ's name and logo are used.</p></section>
    <section class="card"><h3>While it's running</h3>
      <ul class="muted" style="padding-left:18px;margin:0">
        <li>Leave the PlayHQ game page open in its own window, screen on. You can put this small window beside it.</li>
        <li>Don't score the same match in the scorer app at the same time; both would send to the overlay. The scorer's <b>Show on stream</b> buttons still work.</li>
        <li>If PlayHQ stops updating mid-game, tap <b>Pause</b> here and carry on in the scorer.</li></ul></section>
    <section class="card"><h3>Activity</h3><div class="log" id="log"></div></section>`;
  renderTeams(); renderStatus(); $('#log').textContent = logLines.join('\n');
}
function setupScreen() {
  const ov = `${location.origin}${location.pathname.replace(/relay\.html$/, '')}overlay.html?ch=${settings.ch}`;
  return `<section class="card"><h2>Follow PlayHQ live scoring</h2>
    <p>When the club scorer is scoring the game on PlayHQ, this sends PlayHQ's score to your overlay, so you don't have to score it yourself.</p>
    <p class="muted">Works best on a laptop or iPad: it needs the PlayHQ page open, with the screen on, for the whole game. It doesn't need to be at the ground.</p></section>
    <section class="card"><h2>One-time setup: add the bookmark</h2>
    <p><b>Laptop:</b> drag this button to your bookmarks bar.</p>
    <p><a class="bm" id="bm" href="#">📡 Cricket relay</a></p>
    <p><b>iPad / iPhone (Safari):</b> bookmark any page, then edit the bookmark and replace its address with this code:</p>
    <textarea id="code" readonly></textarea>
    <div class="row" style="margin-top:8px"><button class="btn ghost" data-act="copy">Copy code</button></div></section>
    <section class="card"><h2>On match day</h2>
    <ol><li>Open the game on <b>playhq.com</b> (the page with <i>Scorecard</i> and <i>Ball-by-ball</i>).</li>
    <li>Tap the <b>📡 Cricket relay</b> bookmark. This window opens next to it and starts sending.</li>
    <li>Your PRISM overlay link stays the same:<br><span class="muted" style="word-break:break-all">${esc(ov)}</span></li></ol></section>`;
}
function renderTeams() {
  const el = $('#teams'); if (!el) return;
  const opts = sel => `<option value="">PlayHQ name &amp; logo</option>` + Object.keys(library).sort().map(n => `<option ${n === sel ? 'selected' : ''}>${esc(n)}</option>`).join('');
  el.innerHTML = ['home', 'away'].map(k => {
    const t = teamFor(k), p = teamsPhq && teamsPhq[k];
    const sel = rp[k] === undefined || rp[k] === null ? guessLib(p && p.name) : rp[k];
    return `<div class="team"><span class="logo" style="--tp:${t.primary};--ta:${t.accent}">${t.logo ? `<img src="${esc(t.logo)}" alt="">` : esc(t.short)}</span>
      <div><div style="font-weight:700">${esc(p ? p.name : '…')}</div><select data-team="${k}">${opts(sel || '')}</select></div></div>`;
  }).join('');
}
function renderStatus() {
  const el = $('#status'); if (!el) return;
  if (!srcOk && lastErr) {
    const fix = lastErr === "Can't reach PlayHQ" ? 'Check the internet connection. It keeps retrying by itself.'
      : 'Go back to the game on playhq.com (reload it if it looks stuck) and tap the <b>📡 Cricket relay</b> bookmark again.';
    el.innerHTML = `<div class="bad"><b>${esc(lastErr)}.</b> ${fix}</div>`; return;
  }
  if (!lastState) { el.innerHTML = `<p class="muted">Connecting to PlayHQ…</p>`; return; }
  const s = lastState, i = s.innings[s.current], bat = teamFor(i.bat), bowl = teamFor(i.bowl);
  const st = i.batters[i.striker], ns = i.batters[i.nonStriker], bw = i.bowlers[i.bowler];
  void bowl;
  const ago = lastBallAt ? Math.round((Date.now() - lastBallAt) / 1000) : null;
  let line = ''; try { line = statusList(fromState(lastSetup(), s))[0]; } catch (x) {}
  el.innerHTML = `<div class="score" style="background:${esc(bat.primary)}"><div class="t">${esc(bat.name)}</div><div class="r">${i.runs}-${i.wkts}</div><div class="o">(${oversStr(i.legal)})</div></div>
    <div class="line"><b>${esc(line)}</b></div>
    <div class="line muted">${st ? `${esc(st.name)}* ${st.runs} (${st.balls})` : ''}${ns ? ` · ${esc(ns.name)} ${ns.runs} (${ns.balls})` : ''}${bw ? ` · ${esc(bw.name)} ${bw.wkts}-${bw.runs}` : ''}</div>
    <div class="line muted">This over: ${i.thisOver.map(c => esc(c.t)).join(' ') || '–'}${ago != null ? ` · last ball ${ago}s ago` : ''}</div>
    <div class="line muted">${live ? '⚡ Live updates from PlayHQ' : liveSeen ? 'Live updates reconnecting… checking every 4 s' : 'Checking PlayHQ every 4 s' + (logLines.some(l => /older version/.test(l)) ? ' (re-add the bookmark for live updates)' : '')}</div>
    <div class="row" style="margin-top:12px">${rp.on ? `<button class="btn stop" data-act="pause">Pause sending</button>` : `<button class="btn" data-act="resume">Resume sending</button>`}
      <span class="muted">${rp.on ? 'The overlay is following PlayHQ.' : 'Paused: the overlay keeps the last score.'}</span></div>`;
}
let _setup = null; function lastSetup() { return _setup; }
function showScore(setup) { _setup = setup; }

/* ── events ── */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'link') {
    try { const u = new URL($('#lnk').value.trim()); const ch = u.searchParams.get('ch'), k = u.searchParams.get('k');
      if (!ch || !k) throw 0; settings = { ch, key: k }; LS.set('cc.settings', settings); start(); }
    catch (x) { alert("That doesn't look like the scorer's \"Score on another device\" link."); }
  }
  if (a === 'copy') { const t = $('#code'); t.select(); navigator.clipboard ? navigator.clipboard.writeText(t.value).then(() => b.textContent = 'Copied ✓') : document.execCommand('copy'); }
  if (a === 'pause' || a === 'resume') { rp.on = a === 'resume'; LS.set(prefsKey, rp); if (rp.on) { lastState = null; lastSetupJson = ''; } renderStatus(); }
});
document.addEventListener('change', e => {
  const s = e.target.closest('select[data-team]'); if (!s) return;
  rp[s.dataset.team] = s.value || ''; LS.set(prefsKey, rp); renderTeams(); lastState = null; lastSetupJson = '';   // republish with the new look
});
document.addEventListener('dragstart', e => { if (e.target.id === 'bm') e.dataTransfer.setData('text/uri-list', bookmarkletCode()); });

function start() {
  sync = new CricketSync({ ch: settings.ch, key: settings.key });
  sync.onStatus = s => { if (s === 'denied') pill('bad', 'Wrong scorer key'); };
  render();
  const bm = $('#bm'); if (bm) { bm.href = bookmarkletCode(); bm.onclick = e => { e.preventDefault(); alert('Drag this button to your bookmarks bar. Then open the game on playhq.com and click it there.'); }; }
  const code = $('#code'); if (code) code.value = bookmarkletCode();
  if (GAME && src) {
    setInterval(renderStatus, 1000); keepAwake(); loop(); subscribe();
    setTimeout(() => { if (!liveSeen) { log('This bookmark is an older version: checking every 4 s. Re-add it for live updates.'); renderStatus(); } }, 8000);
  }
}
if (settings.ch && settings.key) start(); else render();
</script>
</body>
</html>
